[pytest]
testpaths = tests
addopts =
    -q
    --strict-markers
    --tb=short
    --maxfail=1
    --durations=10
    --timeout=30
    --cov=ci_app
    --cov-report=term-missing
    --cov-report=xml:perf/artifacts/coverage/coverage.xml
    --cov-report=html:perf/artifacts/coverage/html
markers =
    e2e: end-to-end UI tests (Playwright)
    contract: API contract/schema validation
    perf: performance and benchmarks
    resilience: degraded-mode, chaos, concurrency tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
